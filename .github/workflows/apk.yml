# Builds the Android APK in the cloud (no local Android SDK needed).
# Run it from the "Actions" tab (Run workflow) or by pushing a tag v*; download the APK from the run's artifacts.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address used by the app (ex. https://contest.mondomaine.fr/api)"
        required: false
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Set server address
        if: ${{ inputs.api_url }}
        env:
          API_URL: ${{ inputs.api_url }}
        run: |
          sed -i "s|nativeApiUrl: '.*'|nativeApiUrl: '${API_URL}'|" apps/app/src/environments/environment.prod.ts
      - run: npm run build -w @contest/scoring && npm run build -w app
      - run: npx cap sync android
        working-directory: apps/app
      - run: ./gradlew assembleDebug
        working-directory: apps/app/android
      - uses: actions/upload-artifact@v5
        with:
          name: contest-manager-apk
          path: apps/app/android/app/build/outputs/apk/debug/app-debug.apk
